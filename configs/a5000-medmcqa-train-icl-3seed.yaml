# Three-seed replication of the MedMCQA train/eval ICL pilot.
# Same cohort size and pinned revisions as configs/a5000-medmcqa-train-icl-pilot.yaml;
# only the seeds and output root differ. Seeds enter the config hash, so seed 42 is
# retrained here rather than copied from the pilot (its checkpoints would not bind).
# The full-data config (a5000-medmcqa-train-icl.yaml) is ~6.7x larger and is not
# feasible at three seeds on one A5000; this run is the powered version of the pilot.
experiment:
  name: fedicl_mqa_medmcqa_train_icl_3seed
  output_dir: outputs/a5000-medmcqa-train-icl-3seed
  data_seed: 20260901
  training_seeds: [42, 43, 44]
  deterministic: true

data:
  dataset: medmcqa
  medmcqa_id: openlifescienceai/medmcqa
  revision: 91c6572c454088bf71b679ad90aa8dffcd0d5868  # pilot's frozen Hub revision
  num_clients: 5
  dirichlet_alpha: 0.5
  medmcqa_fit_ratio: 0.8
  min_support_per_client: 5
  max_train_samples: 25000
  max_validation_samples: 6000
  max_test_samples: null  # full official validation as final test (4,181)

controls:
  medmcqa_validation_fraction: 0.10
  min_validation_per_subject: 10

model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca  # pilot's frozen revision
  max_seq_length: 4096
  max_new_tokens: 64

retrieval:
  encoder_id: BAAI/bge-small-en-v1.5
  encoder_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a  # pilot's frozen revision
  alpha: 1.0
  beta: 0.15
  gamma: 0.20

icl_training:
  top_k: 5
