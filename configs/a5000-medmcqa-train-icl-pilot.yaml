# One-seed, subsampled pilot of the train/eval ICL factorial on MedMCQA.
# Purpose: a fast directional read of FL ICL vs non-ICL (F0/F1/FT0/FT1) before
# committing to the full three-seed run in configs/a5000-medmcqa-train-icl.yaml.
# Do not report these results as the final experiment; they use one training
# seed and a train/validation subsample chosen for wall-clock time, not power.
experiment:
  name: fedicl_mqa_medmcqa_train_icl_pilot
  output_dir: outputs/a5000-medmcqa-train-icl-pilot
  data_seed: 20260901
  training_seeds: [42]
  deterministic: true

data:
  dataset: medmcqa
  medmcqa_id: openlifescienceai/medmcqa
  revision: main  # prepare-data freezes the immutable Hub revision
  num_clients: 5
  dirichlet_alpha: 0.5
  medmcqa_fit_ratio: 0.8
  min_support_per_client: 5
  # Limits apply after the within-subject validation holdout and before
  # decontamination, so retained counts can be slightly lower than these.
  max_train_samples: 25000
  max_validation_samples: 6000
  max_test_samples: null  # full official validation as final test (4,181)

controls:
  medmcqa_validation_fraction: 0.10
  min_validation_per_subject: 10

model:
  id: Qwen/Qwen3-0.6B
  revision: main
  max_seq_length: 4096
  max_new_tokens: 64

retrieval:
  encoder_id: BAAI/bge-small-en-v1.5
  encoder_revision: main
  alpha: 1.0
  beta: 0.15
  gamma: 0.20

icl_training:
  top_k: 5
